<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Змейка</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--text:#23201b;--muted:#7a7469;--grid:#ece7dc;--snake:#2f7d4f;--head:#1f5a37;--food:#d6452f;--accent:#2f7d4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--panel:#1d2124;--text:#eceae4;--muted:#8d928f;--grid:#262b2e;--snake:#5fbf84;--head:#8fe0ab;--food:#ff6b55;--accent:#5fbf84}}
:root[data-theme="dark"]{--bg:#15181a;--panel:#1d2124;--text:#eceae4;--muted:#8d928f;--grid:#262b2e;--snake:#5fbf84;--head:#8fe0ab;--food:#ff6b55;--accent:#5fbf84}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
.wrap{width:min(94vw,440px);display:flex;flex-direction:column;gap:12px;padding:12px 0}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.bar b{font-size:22px;font-variant-numeric:tabular-nums}
.bar span{color:var(--muted)}
.box{position:relative;background:var(--panel);border-radius:14px;padding:8px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
canvas{display:block;width:100%;aspect-ratio:1;border-radius:8px;touch-action:none}
.ov{position:absolute;inset:8px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,var(--panel) 82%,transparent);text-align:center}
.ov.hide{display:none}
.ov h2{margin:0;font-size:26px}
.ov p{margin:0;color:var(--muted);font-size:14px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 22px;background:var(--accent);color:var(--bg);cursor:pointer}
.hint{text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div><span>Счёт</span> <b id="score">0</b></div>
    <div><span>Рекорд</span> <b id="best">0</b></div>
  </div>
  <div class="box">
    <canvas id="c" width="400" height="400"></canvas>
    <div class="ov" id="ov">
      <h2 id="ovt">Змейка</h2>
      <p id="ovp">Стрелки или WASD. На телефоне — свайпы.</p>
      <button id="go">Играть</button>
    </div>
  </div>
  <div class="hint">Пробел — пауза</div>
</div>
<script>
(function(){
var N=20,S=20,cv=document.getElementById('c'),ctx=cv.getContext('2d');
var scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
var ov=document.getElementById('ov'),ovt=document.getElementById('ovt'),ovp=document.getElementById('ovp'),go=document.getElementById('go');
var snake,dir,queue,food,score,best=0,timer=null,state='idle';
try{best=parseInt(localStorage.getItem('snake-best'))||0}catch(e){}
bestEl.textContent=best;

function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function placeFood(){
  var free=[];
  for(var x=0;x<N;x++)for(var y=0;y<N;y++){
    if(!snake.some(function(s){return s.x===x&&s.y===y}))free.push({x:x,y:y});
  }
  food=free.length?free[Math.floor(Math.random()*free.length)]:null;
}
function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};queue=[];score=0;scoreEl.textContent=0;placeFood();draw();
}
function speed(){return Math.max(60,120-Math.floor(score/5)*6)}
function start(){
  reset();state='run';ov.classList.add('hide');schedule();
}
function schedule(){clearTimeout(timer);timer=setTimeout(tick,speed())}
function pause(){
  if(state==='run'){state='pause';clearTimeout(timer);ovt.textContent='Пауза';ovp.textContent='Пробел — продолжить';go.textContent='Продолжить';ov.classList.remove('hide')}
  else if(state==='pause'){state='run';ov.classList.add('hide');schedule()}
}
function over(){
  state='over';clearTimeout(timer);
  if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('snake-best',best)}catch(e){}}
  ovt.textContent='Игра окончена';ovp.textContent='Счёт: '+score;go.textContent='Ещё раз';ov.classList.remove('hide');
}
function tick(){
  if(queue.length)dir=queue.shift();
  var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(function(s,i){return i<snake.length-1&&s.x===h.x&&s.y===h.y})){draw();over();return}
  snake.unshift(h);
  if(food&&h.x===food.x&&h.y===food.y){score++;scoreEl.textContent=score;placeFood()}else snake.pop();
  draw();
  if(!food){over();return}
  schedule();
}
function turn(nx,ny){
  if(state!=='run')return;
  var last=queue.length?queue[queue.length-1]:dir;
  if(last.x===-nx&&last.y===-ny)return;
  if(last.x===nx&&last.y===ny)return;
  if(queue.length<2)queue.push({x:nx,y:ny});
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function draw(){
  ctx.fillStyle=css('--panel');ctx.fillRect(0,0,400,400);
  ctx.fillStyle=css('--grid');
  for(var x=0;x<N;x++)for(var y=0;y<N;y++)if((x+y)%2===0)ctx.fillRect(x*S,y*S,S,S);
  if(food){ctx.fillStyle=css('--food');ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S/2-3,0,7);ctx.fill()}
  snake.forEach(function(s,i){
    ctx.fillStyle=i===0?css('--head'):css('--snake');
    rr(s.x*S+1,s.y*S+1,S-2,S-2,i===0?7:5);ctx.fill();
  });
}
document.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],'ц':[0,-1],arrowdown:[0,1],s:[0,1],'ы':[0,1],arrowleft:[-1,0],a:[-1,0],'ф':[-1,0],arrowright:[1,0],d:[1,0],'в':[1,0]};
  if(m[k]){e.preventDefault();turn(m[k][0],m[k][1])}
  else if(k===' '){e.preventDefault();if(state==='run'||state==='pause')pause();else start()}
  else if(k==='enter'&&(state==='idle'||state==='over'))start();
});
go.addEventListener('click',function(){if(state==='pause')pause();else start()});
var tx,ty;
cv.addEventListener('touchstart',function(e){var t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
cv.addEventListener('touchmove',function(e){
  if(tx==null)return;var t=e.touches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
  if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
  tx=t.clientX;ty=t.clientY;
},{passive:true});
cv.addEventListener('touchend',function(){tx=null});
window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
reset();
})();
</script>
</body>
</html>
